<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>VIDORA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f4fb;--surface:#fff;--surface2:#efecf7;--text:#17151f;--muted:#6b6882;--line:#e3dff0;--a1:#ff7a45;--a2:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a12;--surface:#14141f;--surface2:#1c1c2b;--text:#f3f2fa;--muted:#8c8aa6;--line:#272738;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a12;--surface:#14141f;--surface2:#1c1c2b;--text:#f3f2fa;--muted:#8c8aa6;--line:#272738;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 85% 0%,color-mix(in srgb,var(--a2) 28%,transparent),transparent),radial-gradient(50% 35% at 0% 22%,color-mix(in srgb,var(--a1) 20%,transparent),transparent)}
.app{max-width:460px;margin:auto;padding:14px 18px 120px}
header{display:flex;align-items:center;gap:10px}
.wm{font-weight:800;letter-spacing:.2em;font-size:20px;direction:ltr}
.chip{margin-inline-start:auto;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
h1{font-size:30px;line-height:1.4;margin:26px 0 6px;font-weight:800}
h1 span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px}
.portal{position:relative;margin-top:20px;padding:16px;border-radius:24px;background:var(--surface);overflow:hidden}
.portal::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1.5px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.portal.scan::after{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--a1),transparent);animation:sc 1s linear infinite}
@keyframes sc{to{transform:translateY(200px)}}
.row{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:16px;padding:6px 12px 6px 6px}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;direction:ltr;text-align:left;padding:10px 4px}
.ghost{border:0;background:var(--surface);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a2));cursor:pointer;margin-top:12px;position:relative;overflow:hidden}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn span{position:relative}
.fill{position:absolute;inset:0;width:var(--p,0%);background:rgba(255,255,255,.3);transition:width .15s}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center}
.res{display:none;margin-top:16px;padding:14px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.res.on{display:block;animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.vid{display:flex;gap:12px;align-items:center}
.th{width:76px;height:76px;border-radius:18px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 50) 70% 28%))}
.vid b{font-size:15px;display:block;overflow-wrap:anywhere}
.vid span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:14px}
.q{flex:1;padding:9px 4px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.q small{color:var(--muted);font-size:11px}
.q.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 14%,transparent)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px}
.sec-h h2{font-size:17px}
.link{border:0;background:none;color:var(--a1);font:inherit;font-size:12px;cursor:pointer}
.it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.it .th{width:54px;height:54px;border-radius:14px}
.mt{flex:1;min-width:0}
.mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt span,.mt em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.x{border:0;background:var(--surface2);color:var(--muted);width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;width:100%;max-width:440px;padding:8px;border-radius:26px;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.bar button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:8px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bar button.on{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
svg{display:block}
.view{display:none}.view.on{display:block}
.info{display:flex;gap:8px;margin-top:14px}.info div{flex:1;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}.info small{display:block;color:var(--muted);font-size:11px}.info b{font-size:13px}
.cx{display:none;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;margin:10px auto 0;cursor:pointer}.cx.on{display:block}
.ac{display:flex;gap:6px}.ac button{border:0;background:var(--surface2);color:var(--text);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;padding:10px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;cursor:pointer}.seg button.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 14%,transparent)}
.card{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}.card p{font-size:13px;color:var(--muted);margin-top:8px}
dialog{border:0;border-radius:20px;padding:12px;background:var(--surface);color:var(--text);width:min(92vw,520px)}dialog::backdrop{background:rgba(0,0,0,.6)}dialog video,dialog audio{width:100%;border-radius:12px}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}input{-webkit-user-select:text;user-select:text}html,body{overscroll-behavior:none}</style></head><body><div class="app"><header>
<svg width="38" height="38" viewBox="0 0 48 48" aria-label="VIDORA"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#g)"/><path d="M14 14h20L24 33z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M15 40h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
<div class="wm">VIDORA</div>
<div class="chip">نموذج أولي</div>
</header>
<section class="view on" id="v-home">
<h1>احفظ ما يعجبك،<br><span>بلمسة واحدة</span></h1>
<p class="sub">الصق رابط الملف، ودعنا نحلله ونجهزه لك.</p>
<div class="portal" id="portal">
<div class="row"><button class="ghost" id="paste">لصق</button><input id="url" type="url" inputmode="url" placeholder="https://example.com/video.mp4" aria-label="رابط الفيديو"></div>
<button class="btn" id="an"><span>تحليل الرابط</span></button>
<p class="note">للروابط المباشرة والمحتوى المسموح بتنزيله فقط</p>
</div>
<div class="res" id="res">
<div class="vid"><div class="th" id="rth"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div><div><b id="rt"></b><span id="rs"></span></div></div>
<div class="info"><div><small>الصيغة</small><b id="if"></b></div><div><small>الحجم</small><b id="is"></b></div><div><small>النوع</small><b id="ik"></b></div></div>
<button class="btn" id="dl" disabled><div class="fill"></div><span>ابدأ التنزيل</span></button>
<button class="cx" id="cx">إلغاء التنزيل</button>
</div>
<div class="sec-h"><h2>آخر التنزيلات</h2><button class="link" id="all">عرض الكل</button></div>
<div id="list"></div>
</section>
<section class="view" id="v-lib"><div class="sec-h"><h2>مكتبتي</h2></div><div id="lib"></div></section>
<section class="view" id="v-set"><div class="sec-h"><h2>الإعدادات</h2></div>
<div class="card"><b>المظهر</b><div class="seg"><button data-m="auto">تلقائي</button><button data-m="light">نهاري</button><button data-m="dark">ليلي</button></div></div>
<div class="card"><b>مكان الحفظ</b><p>تُحفظ الملفات داخل مساحة التطبيق، ويمكنك تصديرها إلى مجلدات الهاتف بزر المشاركة.</p><p id="use"></p></div>
</section></div><nav><div class="bar">
<button class="on" data-t="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
<button data-t="lib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 9h16M9 5v14"/></svg>المكتبة</button>
<button data-t="set"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>الإعدادات</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<dialog id="pl"><div id="pm"></div><button class="btn sec" id="cl" style="background:var(--surface2);color:var(--text)"><span>إغلاق</span></button></dialog>
<script src="app.js"></script></body></html>
